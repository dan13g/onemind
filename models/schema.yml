        tests: [not_null, unique]
  - name: link_referral_assessment
    columns:
      - name: referral_assessment_lk
        tests: [not_null, unique]
  - name: link_referral_episode
    columns:
      - name: referral_episode_lk
        tests: [not_null, unique]
  - name: link_episode_session
    columns:
