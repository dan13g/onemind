version: 2

models:
  - name: hub_client
    description: Data Vault hub containing one source-qualified client identity per source record.
    columns:
      - name: client_hk
        tests: [not_null, unique]
      - name: source_client_business_key
        tests: [not_null, unique]
      - name: record_source
        tests: [not_null]

  - name: sat_client_onemind
    description: Historical descriptive satellite for OneMind clients.
    columns:
      - name: client_satellite_pk
        tests: [not_null, unique]
      - name: client_hk
        tests:
          - not_null
          - relationships:
              to: ref('hub_client')
              field: client_hk
      - name: hashdiff
        tests: [not_null]

  - name: sat_client_brightpath
    description: Historical descriptive satellite for BrightPath clients.
    columns:
      - name: client_satellite_pk
        tests: [not_null, unique]
      - name: client_hk
        tests:
          - not_null
          - relationships:
              to: ref('hub_client')
              field: client_hk
      - name: hashdiff
        tests: [not_null]

  - name: bv_client_deterministic_match
    description: High-confidence exact matching rules applied before fuzzy matching.
    columns:
      - name: onemind_client_hk
        tests: [not_null, unique]
      - name: brightpath_client_hk
        tests: [not_null, unique]
      - name: match_rule
        tests:
          - not_null
          - accepted_values:
              values:
                - NHS_NUMBER_EXACT
                - EMAIL_DOB_EXACT
                - PHONE_DOB_EXACT
                - SURNAME_DOB_POSTCODE_EXACT

  - name: bv_client_fuzzy_candidates
    description: Blocked candidate pairs for unmatched source clients with the same DOB and plausible name or postcode evidence.
    columns:
      - name: onemind_client_hk
        tests: [not_null]
      - name: brightpath_client_hk
        tests: [not_null]
      - name: first_name_similarity
        tests: [not_null]
      - name: last_name_similarity
        tests: [not_null]

  - name: bv_client_fuzzy_scored
    description: Weighted fuzzy evidence and AUTO_MATCH, MANUAL_REVIEW or NO_MATCH decision.
    columns:
      - name: onemind_client_hk
        tests: [not_null]
      - name: brightpath_client_hk
        tests: [not_null]
      - name: fuzzy_match_score
        tests: [not_null]
      - name: fuzzy_match_decision
        tests:
          - not_null
          - accepted_values:
              values: [AUTO_MATCH, MANUAL_REVIEW, NO_MATCH]

  - name: bv_client_fuzzy_auto_match
    description: Mutual-best high-confidence fuzzy matches accepted automatically.
    columns:
      - name: onemind_client_hk
        tests: [not_null, unique]
      - name: brightpath_client_hk
        tests: [not_null, unique]
      - name: match_method
        tests:
          - accepted_values:
              values: [FUZZY]

  - name: bv_client_review_queue
    description: Ambiguous fuzzy candidates requiring human review before a merge decision.

  - name: bv_client_match
    description: Final accepted client matches combining deterministic and safeguarded fuzzy auto-matches.
    columns:
      - name: onemind_client_hk
        tests: [not_null, unique]
      - name: brightpath_client_hk
        tests: [not_null, unique]
      - name: match_rule
        tests: [not_null]
      - name: match_score
        tests: [not_null]
      - name: match_method
        tests:
          - not_null
          - accepted_values:
              values: [DETERMINISTIC, FUZZY]
      - name: match_status
        tests:
          - accepted_values:
              values: [AUTO_MATCHED]

  - name: hub_master_client
    description: Data Vault hub representing the unified real-world client.
    columns:
      - name: master_client_hk
        tests: [not_null, unique]

  - name: link_master_client_source_client
    description: Link between mastered clients and their source-system client identities.
    columns:
      - name: master_client_source_client_lk
        tests: [not_null, unique]
      - name: master_client_hk
        tests:
          - not_null
          - relationships:
              to: ref('hub_master_client')
              field: master_client_hk
      - name: client_hk
        tests:
          - not_null
          - relationships:
              to: ref('hub_client')
              field: client_hk

  - name: bv_master_client_current
    description: One current mastered client record per master-client identity.
    columns:
      - name: master_client_hk
        tests: [not_null, unique]
      - name: source_system_count
        tests:
          - not_null
          - accepted_values:
              values: [1, 2]

  - name: dim_client
    description: Current-state conformed Kimball client dimension.
    columns:
      - name: client_key
        tests: [not_null, unique]
      - name: master_client_hk
        tests: [not_null, unique]
      - name: source_system_count
        tests:
          - accepted_values:
              values: [1, 2]

  - name: semantic_client
    description: Privacy-conscious secure client view for Power BI.
    columns:
      - name: client_key
        tests: [not_null, unique]
