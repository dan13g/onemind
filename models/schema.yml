        tests: [not_null, unique]
      - name: brightpath_client_hk
        tests: [not_null, unique]
      - name: match_rule
        tests:
          - accepted_values:
              arguments:
                values: ['NHS_NUMBER_EXACT','EMAIL_DOB_EXACT','PHONE_DOB_EXACT','SURNAME_DOB_POSTCODE_EXACT']
  - name: bv_master_client_assignment
    columns:
      - name: client_hk
        tests: [not_null, unique]
      - name: master_client_hk
        tests: [not_null]
  - name: hub_master_client
    columns:
      - name: master_client_hk
        tests: [not_null, unique]
  - name: pit_client
    columns:
      - name: client_hk
        tests: [not_null, unique]
  - name: dim_client
    columns:
      - name: client_key
        tests: [not_null, unique]
  - name: fact_session
    columns:
      - name: session_key
        tests: [not_null, unique]
  - name: fact_referral
    columns:
      - name: referral_key
        tests: [not_null, unique]
